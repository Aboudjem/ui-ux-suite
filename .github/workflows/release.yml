name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Install npm 11.x, NOT npm@latest:
      # npm 12 requires node ^22.22.2 || ^24.15.0 || >=26.0.0, which the pinned
      # node 22.14 does not satisfy, so npm@latest fails with EBADENGINE.
      # npm 11.x engines are ^20.17.0 || >=22.9.0, which node 22.14 does satisfy.
      - name: Ensure npm supports trusted publishing (>=11.5.1)
        run: |
          CURRENT=$(npm --version)
          echo "Node $(node --version), npm $CURRENT"
          node -e "
          const [a,b,c] = process.argv[1].split('.').map(n => parseInt(n,10));
          const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
          if (!ok) { console.log('Upgrading npm from', process.argv[1], 'to 11.x'); }
          process.exit(ok ? 0 : 42);
          " "$CURRENT" || npm install -g 'npm@^11'
          echo "Using npm $(npm --version)"

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Validate Claude Code plugin manifest matches package.json
        run: |
          node -e "
          const fs = require('fs');
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          const pkg = require('./package.json');
          if (plugin.version !== pkg.version) {
            console.error('.claude-plugin/plugin.json version', plugin.version, 'does not match package.json version', pkg.version);
            process.exit(1);
          }
          console.log('Claude Code plugin version matches package.json:', plugin.version);
          "

      - name: Publish to npm with provenance (OIDC)
        run: npm publish --provenance --access public

      # The release body is the CHANGELOG entry of this version, written for a reader.
      # The step fails when that entry is missing, so a release never ships a bare commit list.
      - name: Read the release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  # The MCP registry holds metadata only, and it checks that the npm package of this exact
  # version carries the matching mcpName. So this job runs after the npm publish, as its own
  # job: when it fails it can be re-run alone, without publishing to npm twice.
  mcp-registry:
    name: Publish to the MCP registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4

      - name: Verify server.json matches the tag and package.json
        run: |
          node -e "
          const pkg = require('./package.json');
          const server = require('./server.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const bad = [];
          if (server.version !== tag) bad.push('server.json version ' + server.version + ' is not the tag ' + tag);
          if (server.name !== pkg.mcpName) bad.push('server.json name ' + server.name + ' is not package.json mcpName ' + pkg.mcpName);
          const p = (server.packages || [])[0] || {};
          if (p.identifier !== pkg.name || p.version !== pkg.version) bad.push('server.json packages[0] is ' + p.identifier + '@' + p.version + ', package.json is ' + pkg.name + '@' + pkg.version);
          if (bad.length) { console.error(bad.join('\n')); process.exit(1); }
          console.log('server.json matches', pkg.name + '@' + pkg.version);
          "

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Wait until npm serves this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "ui-ux-suite@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves ui-ux-suite@$VERSION"; exit 0
            fi
            sleep 10
          done
          echo "npm does not serve ui-ux-suite@$VERSION after 5 minutes"; exit 1

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP registry
        run: ./mcp-publisher publish

  sync-10x:
    name: Sync 10x marketplace
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Dispatch plugin-released to 10x
        env:
          DISPATCH_TOKEN: ${{ secrets.TEN_X_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "TEN_X_DISPATCH_TOKEN secret not set; skipping 10x sync."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Aboudjem/10x/dispatches \
            -d "{\"event_type\":\"plugin-released\",\"client_payload\":{\"plugin\":\"ui-ux-suite\",\"version\":\"$VERSION\"}}")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "10x dispatch failed with HTTP $HTTP_CODE:"
            cat /tmp/dispatch.json
            echo "Rotate TEN_X_DISPATCH_TOKEN at https://github.com/Aboudjem/ui-ux-suite/settings/secrets/actions"
            exit 1
          fi
          echo "10x dispatch succeeded (HTTP 204)."
