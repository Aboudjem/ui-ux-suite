name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate modules
        run: npm test

      - name: Validate Claude Code plugin + marketplace manifests
        run: |
          node -e "
          const fs = require('fs');
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          const pkg = require('./package.json');
          if (!plugin.name) { console.error('.claude-plugin/plugin.json missing name'); process.exit(1); }
          if (plugin.version !== pkg.version) {
            console.error('.claude-plugin/plugin.json version', plugin.version, 'does not match package.json version', pkg.version);
            process.exit(1);
          }
          console.log('Claude Code plugin manifest valid: name=' + plugin.name + ' version=' + plugin.version);

          if (fs.existsSync('.claude-plugin/marketplace.json')) {
            const mp = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            if (!mp.name || !Array.isArray(mp.plugins) || mp.plugins.length === 0) {
              console.error('.claude-plugin/marketplace.json invalid: missing name or plugins');
              process.exit(1);
            }
            const self = mp.plugins.find(p => p.name === plugin.name);
            if (self && self.version !== pkg.version) {
              console.error('marketplace.json version for', plugin.name, '(' + self.version + ') does not match package.json (' + pkg.version + ')');
              process.exit(1);
            }
            console.log('Marketplace manifest valid:', mp.name, 'listing', mp.plugins.length, 'plugins');
          }
          "

      - name: Validate slash commands
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          if (!fs.existsSync('commands')) {
            console.log('No commands/ dir, skipping.');
          } else {
            const files = fs.readdirSync('commands').filter(f => f.endsWith('.md'));
            if (files.length === 0) { console.error('commands/ directory is empty'); process.exit(1); }
            const bad = [];
            for (const f of files) {
              const content = fs.readFileSync(path.join('commands', f), 'utf8');
              if (!content.startsWith('---')) bad.push(f + ': missing YAML frontmatter');
              else if (!/description:/m.test(content)) bad.push(f + ': frontmatter missing description');
            }
            if (bad.length) { console.error('Invalid slash commands:', bad); process.exit(1); }
            console.log('Slash commands valid:', files.length, 'files');
          }
          "

      - name: Verify package.json
        run: |
          node -e "
          const p = require('./package.json');
          const required = ['name','version','description','license','repository','engines','files','keywords'];
          const missing = required.filter(k => !p[k]);
          if (missing.length) { console.error('Missing fields:', missing); process.exit(1); }
          console.log('package.json valid');
          "

      - name: Check markdown links
        # Checks relative file links in key markdown files (skips external URLs to avoid network flakiness)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const files = ['README.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'AGENTS.md'];
          const relLinkRe = /\[([^\]]+)\]\((?!https?:\/\/)([^)#]+)\)/g;
          let bad = [];
          for (const f of files) {
            if (!fs.existsSync(f)) continue;
            const content = fs.readFileSync(f, 'utf8');
            let m;
            while ((m = relLinkRe.exec(content)) !== null) {
              const target = m[2].split('#')[0];
              if (target && !fs.existsSync(target)) {
                bad.push(f + ': broken link -> ' + target);
              }
            }
          }
          if (bad.length) { console.error('Broken relative links found:\\n' + bad.join('\\n')); process.exit(1); }
          console.log('Markdown relative links OK');
          "

      - name: Scan for hardcoded secrets
        # Flags patterns that commonly indicate accidental secret commits
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const PATTERNS = [
            /(?:api[_-]?key|apikey|secret|password|token|bearer|passwd)\s*[:=]\s*['"][^'"]{8,}['"]/i,
            /sk-[A-Za-z0-9]{20,}/,
            /ghp_[A-Za-z0-9]{36}/,
            /xoxb-[A-Za-z0-9-]{24,}/,
            /AKIA[0-9A-Z]{16}/,
          ];
          const IGNORE_DIRS = new Set(['node_modules', '.git', 'test/fixtures']);
          const IGNORE_EXTS = new Set(['.png', '.svg', '.jpg', '.ico', '.woff', '.woff2']);
          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (!IGNORE_DIRS.has(entry.name) && !entry.name.startsWith('.')) walk(full, files);
              } else if (!IGNORE_EXTS.has(path.extname(entry.name))) {
                files.push(full);
              }
            }
            return files;
          }
          let hits = [];
          for (const f of walk('.')) {
            let content;
            try { content = fs.readFileSync(f, 'utf8'); } catch { continue; }
            for (const re of PATTERNS) {
              if (re.test(content)) { hits.push(f + ': matches secret pattern ' + re); break; }
            }
          }
          if (hits.length) { console.error('Potential secrets found:\\n' + hits.join('\\n')); process.exit(1); }
          console.log('Secret scan clean');
          "
